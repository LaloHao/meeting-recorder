{{- if eq .Values.storage.type "pvc" }}
# Recordings on a volume (instead of s3).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-recordings
  namespace: {{ .Release.Namespace }}
  annotations:
    # Recordings survive `helm uninstall`.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.pvc.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.pvc.size }}
{{- end }}
