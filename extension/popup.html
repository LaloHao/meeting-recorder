<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #202124; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button { width: 100%; padding: 8px; font-size: 13px; border: 0; border-radius: 6px; cursor: pointer; }
      #toggle { background: #1a73e8; color: white; }
      #toggle.recording { background: #d93025; }
      #grant { background: #f1f3f4; margin-top: 8px; }
      label { display: flex; gap: 6px; align-items: center; margin: 10px 0; }
      label.stack { flex-direction: column; align-items: stretch; gap: 4px; color: #5f6368; }
      input[type="text"] { padding: 6px; border: 1px solid #dadce0; border-radius: 6px; font: inherit; }
      #status { margin-top: 10px; color: #5f6368; min-height: 1.2em; }
      #error { margin-top: 6px; color: #d93025; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Meeting Recorder</h1>
    <button id="toggle">Grabar esta pestaña</button>
    <label><input type="checkbox" id="includeMic" checked /> Incluir mi micrófono</label>
    <label><input type="checkbox" id="autoCaptions" checked /> Activar subtítulos en Meet (para saber quién habla)</label>
    <label class="stack">Tu nombre en la reunión
      <input type="text" id="selfName" placeholder="Reemplaza a &quot;Tú&quot; en los subtítulos" />
    </label>
    <button id="grant" hidden>Conceder acceso al micrófono</button>
    <div id="status"></div>
    <div id="error"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
